    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines.main = tl;

      // Signal phases: green [0, 2), amber [2, 3), red [3, 7), green [7, 10).
      tl.set("#green-lamp, #green-lens", { opacity: 1 }, 0);
      tl.set("#amber-lamp, #amber-lens, #red-lamp, #red-lens", { opacity: 0.14 }, 0);
      tl.set("#green-lamp, #green-lens", { opacity: 0.14 }, 2);
      tl.set("#amber-lamp, #amber-lens", { opacity: 1 }, 2);
      tl.set("#amber-lamp, #amber-lens", { opacity: 0.14 }, 3);
      tl.set("#red-lamp, #red-lens", { opacity: 1 }, 3);
      tl.set("#red-lamp, #red-lens", { opacity: 0.14 }, 7);
      tl.set("#green-lamp, #green-lens", { opacity: 1 }, 7);

      // Vehicle nose crosses the stop line at y=486 while the corresponding phase is visible.
      tl.to("#green-car", { y: -470, duration: 2.6, ease: "none" }, 0);
      tl.to("#stop-car", { y: 650, duration: 2.1, ease: "power2.out" }, 0.5);
      tl.to("#stop-car", { y: -370, duration: 2.5, ease: "power2.in" }, 7.05);
      tl.to("#red-car", { y: -390, duration: 3.75, ease: "none" }, 3.55);
