<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #303435; }
      #root { width: 1920px; height: 1080px; overflow: hidden; position: relative; }
      #intersection { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      .vehicle { position: absolute; width: 360px; height: 240px; object-fit: contain; }
      .signal-state { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-199x" id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <img data-hf-id="hf-8isx" id="intersection" src="assets/intersection.png" alt="" />
      <img data-hf-id="hf-m2wb" id="signal-red" class="signal-state clip" data-start="3" data-duration="4" src="assets/signal-red.png" alt="" />
      <img data-hf-id="hf-61ft" id="signal-amber" class="signal-state clip" data-start="2" data-duration="1" src="assets/signal-amber.png" alt="" />
      <img data-hf-id="hf-iyf3" id="signal-green-first" class="signal-state clip" data-start="0" data-duration="2" src="assets/signal-green.png" alt="" />
      <img data-hf-id="hf-un1j" id="signal-green-last" class="signal-state clip" data-start="7" data-duration="3" src="assets/signal-green.png" alt="" />

      <img data-hf-id="hf-65rc" id="green-car" class="vehicle clip" data-start="0" data-duration="2.5" src="assets/gold-sedan.png" alt="" style="left:1120px;top:790px" />
      <img data-hf-id="hf-z83i" id="stop-car" class="vehicle clip" data-start="0.5" data-duration="9.5" src="assets/blue-sedan.png" alt="" style="left:570px;top:850px" />
      <img data-hf-id="hf-debe" id="red-car" class="vehicle clip" data-layout-allow-overflow data-start="3.55" data-duration="3.75" src="assets/red-sedan.png" alt="" style="left:1450px;top:840px;rotate:56deg" />
    </div>
    <script>
      const timeline = gsap.timeline({ paused: true });
      window.__timelines.main = timeline;

      // Vehicle sprites are photoreal generated cutouts over a generated, fixed-camera scene.
      // Their independent motion makes the annotated crossing and stop intervals reproducible.
      timeline.to("#green-car", { x: -340, y: -520, duration: 2.5, ease: "none" }, 0);
      timeline.to("#stop-car", { y: -170, duration: 2.2, ease: "none" }, .5);
      timeline.to("#stop-car", { x: -220, y: -360, duration: 2.5, ease: "none" }, 7.05);
      // The uphill car faces the direction of travel, so its box's top-edge
      // midpoint stays close to the visible front as it passes the stripe.
      timeline.to("#red-car", { x: -200, y: -350, duration: 3.75, ease: "none" }, 3.55);
      timeline.seek(0);
    </script>
  </body>
</html>
